plugins {    id 'com.android.application'    id 'kotlin-android'    id 'kotlin-kapt'    id 'kotlin-parcelize'    id 'com.google.gms.google-services'}apply from: "$project.rootDir/tools/script-grgit-version.gradle"android {    namespace = "kr.djspi.pipe01"    compileSdk 35    defaultConfig {        applicationId "kr.djspi.pipe01"        minSdkVersion 23        targetSdk 35        // NFC 모듈 교체 전까지 31 이상으로 업그레이드하지 않을 것        // tools/script-grgit-version.gradle 참조        versionCode gitVersionCode + 13        versionName gitVersionName        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"        aaptOptions.cruncherEnabled = false        setProperty("archivesBaseName", "$applicationId-$versionCode($versionName)")//        ndk {//            abiFilters 'armeabi-v7a', 'x86'//        }    }    // 3rd party    applicationVariants.all { variant ->        variant.outputs.all {            variant.buildConfigField "String", "CLIENT_ID", "\"2ckb549ihl\""            variant.buildConfigField "String", "CLIENT_SECRET", "\"OQIllDmpKhAJHgUSChZcBkGTDw5Vq7r0j8QjPxWk\""            variant.buildConfigField "String", "KAKAO_APP_KEY", "\"f389a3003f035270af558e04db3fa9f2\""            variant.buildConfigField "String", "NFC_APP_KEY", "\"2ec29d3c973e2fa2e8c5ce49f98b5e64\""            variant.buildConfigField "String", "NFC_OFFLINE_KEY", "\"0HaywLgnV0q1OycMY9Fa0uWzODl+QHLkeXXROOx3ztU1AbbFTZcz3RTFiQ0HXUYFU4fKpmPt1oyuMbrZH0Jz+w==\""            variant.buildConfigField "byte[]", "k", "{(byte) 0x32, (byte) 0x30, (byte) 0x31, (byte) 0x34}"            variant.buildConfigField "byte[]", "a", "{(byte) 0x73, (byte) 0x77}"            outputFileName = "${android.defaultConfig.applicationId}-${variant.name}-${variant.versionName}.apk"        }    }    buildTypes {        release {            minifyEnabled true            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'            buildConfigField "boolean", "setReadOnly", "false"        }        debug {            debuggable true//            minifyEnabled true//            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'            buildConfigField "boolean", "setReadOnly", "false"        }    }    compileOptions {        sourceCompatibility JavaVersion.VERSION_17        targetCompatibility JavaVersion.VERSION_17    }    kotlinOptions {        jvmTarget = "17"    }    buildFeatures {        buildConfig true        viewBinding true    }}kapt {    arguments {        arg("room.schemaLocation", "$projectDir/schemas")        arg("room.incremental", "true")    }}kotlin {    jvmToolchain(17)}dependencies {    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')    implementation 'androidx.activity:activity-ktx:1.8.2'    implementation 'androidx.fragment:fragment-ktx:1.6.2'    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"    implementation 'androidx.appcompat:appcompat:1.5.0'    implementation 'androidx.core:core-ktx:1.8.0'    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'    implementation 'androidx.preference:preference-ktx:1.2.0'    // for sdk35 update    implementation 'com.google.android.material:material:1.12.0'    // for map-sdk update    implementation 'com.google.android.gms:play-services-location:21.3.0'    implementation 'com.google.code.gson:gson:2.9.0'    // for taplinx offline verification: DO NOT MODIFY    implementation platform('com.google.firebase:firebase-bom:33.16.0')    implementation 'com.google.firebase:firebase-analytics'    implementation 'com.google.firebase:firebase-messaging'    // In-app updates is a Play Core library feature that prompts active users to update your app    implementation 'com.google.android.play:app-update:2.1.0'    implementation 'com.google.android.play:app-update-ktx:2.1.0'    implementation 'androidx.room:room-runtime:2.4.3'    implementation 'com.google.android.gms:play-services-analytics:18.0.4'    kapt 'androidx.room:room-compiler:2.4.3' // For Kotlin use kapt instead of annotationProcessor    // optional - Kotlin Extensions and Coroutines support for Room    implementation 'androidx.room:room-ktx:2.4.3'    implementation 'com.naver.maps:map-sdk:3.17.0'    implementation 'com.andkulikov:transitionseverywhere:2.1.0'    implementation 'com.andreabaccega:android-edittext-validator:1.3.5'//    implementation('taplinx-android:nxpnfcandroidlib:1.7@aar') {//        transitive = true//    }    // retrofit    implementation 'com.squareup.retrofit2:retrofit:2.9.0'    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'    implementation 'com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.6'    // glide    implementation 'com.github.bumptech.glide:glide:4.13.2'    kapt 'com.github.bumptech.glide:compiler:4.13.2'    compileOnly 'javax.annotation:jsr250-api:1.0'    testImplementation 'junit:junit:4.13.2'    // debugImplementation because LeakCanary should only run in debug builds.//    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.0-beta-3'    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1"    implementation 'androidx.work:work-runtime:2.7.1'    // viewpager2    implementation 'androidx.viewpager2:viewpager2:1.0.0'    // DrawerLayout    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'    // RecyclerView    implementation 'androidx.recyclerview:recyclerview:1.3.2'    // Navigation Component (https://developer.android.com/guide/navigation?hl=ko)    implementation("androidx.navigation:navigation-fragment-ktx:2.7.7")    implementation("androidx.navigation:navigation-ui-ktx:2.7.7")    // CoordinatorLayout    implementation("androidx.coordinatorlayout:coordinatorlayout:1.3.0")}